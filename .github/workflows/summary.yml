name: Summarize new issues
on:
  issues:
    types:
    - opened
permissions:
  issues: write
  pull-requests: read
  contents: read
  models: read
jobs:
  assist:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: AI Issue Analysis
      id: analysis
      uses: actions/ai-inference@v1
      with:
        prompt: "Analyze the following GitHub issue for the SeriesScape project.\n\
          The project helps users track movies and TV shows they've watched or plan
          to watch.\nCore features include manual item entry, filtering, sorting,
          theming, and data import/export.\n\nIssue Title: ${{ github.event.issue.title
          }}\nIssue Body:\n${{ github.event.issue.body }}\n\n---\nPlease provide the
          following in a structured format:\n\n1.  **Summary (1-2 sentences):** Briefly
          summarize the main point of the issue.\n2.  **Classification:** Classify
          the issue as one of: `bug`, `feature request`, `question`, `documentation`,
          or `other`. Output only the single classification word.\n3.  **Affected
          Feature/Module (if applicable):** Identify the primary feature or code module
          this issue relates to (e.g., `watchlist`, `UI`, `import/export`, `settings`,
          `filters`, `search`, `add/edit modal`, `feedback form`, `setup/installation`).
          If multiple, list the main one or up to two. If not applicable, state \"\
          N/A\".\n4.  **Key Information/Problem Statement:** Extract the core problem
          or request.\n5.  **User Expectation (if a bug or feature request):** What
          does the user expect to happen or want to achieve? If not applicable, state
          \"N/A\".\n6.  **Reproducibility (if a bug):** Does the user provide steps
          to reproduce? (Yes/No/Partial/N/A)\n\nFormat the output as follows, ensuring
          \"Classification\" contains only the single classification word:\n\n**AI
          Analysis:**\n- **Summary:** [Your 1-2 sentence summary here]\n- **Classification:**
          [bug|feature request|question|documentation|other]\n- **Affected Feature/Module:**
          [Your identified feature/module or N/A]\n- **Key Information:** [Your extracted
          key information]\n- **User Expectation:** [Your extracted user expectation
          or N/A]\n- **Reproducibility:** [Yes|No|Partial|N/A]\n"
        model: openai/gpt-4o-mini
        max-tokens: 800
    - name: Post AI Analysis as Comment
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        AI_RESPONSE: ${{ steps.analysis.outputs.response }}
      run: "# Extract the full AI response for the comment\n# The response from actions/ai-inference
        is directly in steps.analysis.outputs.response\nFULL_COMMENT_BODY=$(echo \"\
        $AI_RESPONSE\" | sed 's/Classification: .*/Classification: [The classification
        determined by AI]/')\n\ngh issue comment \"$ISSUE_NUMBER\" --body \"$FULL_COMMENT_BODY\"\
        \n"
    - name: Extract Classification for Labeling
      id: extract_label
      env:
        AI_RESPONSE: ${{ steps.analysis.outputs.response }}
      run: "# Sanitize: strip non-printable characters (control chars, null bytes,
        ANSI escape codes)\n# before any processing — guards against edge cases even
        when using env vars.\nSAFE_RESPONSE=$(echo \"$AI_RESPONSE\" | tr -cd '[:print:]\\\
        n')\n\n# Extract the raw classification word for labeling.\n# Uses SAFE_RESPONSE
        (not AI_RESPONSE) to avoid variable-injection risks in shell.\nCLASSIFICATION_WORD=$(echo
        \"$SAFE_RESPONSE\" | grep -oP 'Classification: \\K\\w+( \\w+)*' | tr '[:upper:]'
        '[:lower:]' | sed 's/ /-/g')\n\n# Emit the extracted value into the Actions
        debug log for traceability.\necho \"::debug::Raw AI classification extracted:
        '${CLASSIFICATION_WORD:-<empty>}'\"\n\n# Separate branches with distinct log
        annotations so the reason for any\n# fallback is immediately visible in the
        Actions UI without digging into logs.\nif [ -z \"$CLASSIFICATION_WORD\" ];
        then\n  echo \"::warning::No classification keyword found in AI response.
        Falling back to 'needs-triage'.\"\n  echo \"AI_LABEL=needs-triage\" >> $GITHUB_OUTPUT\n\
        elif [ \"$CLASSIFICATION_WORD\" = \"other\" ]; then\n  echo \"::notice::AI
        classified the issue as 'other' (no specific label applies). Falling back
        to 'needs-triage'.\"\n  echo \"AI_LABEL=needs-triage\" >> $GITHUB_OUTPUT\n\
        else\n  echo \"::notice::AI classification resolved to label: '${CLASSIFICATION_WORD}'\"\
        \n  echo \"AI_LABEL=$CLASSIFICATION_WORD\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Add Label Based on AI Classification
      if: steps.extract_label.outputs.AI_LABEL != '' && 
        steps.extract_label.outputs.AI_LABEL != 'needs-triage'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: "const label = process.env.AI_LABEL;\n// Check if label is one of
          the expected types to avoid adding arbitrary labels\nconst allowedLabels
          = ['bug', 'feature-request', 'question', 'documentation'];\nif (allowedLabels.includes(label))
          {\n  github.rest.issues.addLabels({\n    issue_number: context.issue.number,\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    labels:
          [label]\n  });\n} else {\n  console.log(`AI suggested label \"${label}\"\
          \ is not in the allowed list. Skipping auto-labeling.`);\n  github.rest.issues.addLabels({\n\
          \    issue_number: context.issue.number,\n    owner: context.repo.owner,\n\
          \    repo: context.repo.repo,\n    labels: ['needs-triage']\n  });\n}\n"
      env:
        AI_LABEL: ${{ steps.extract_label.outputs.AI_LABEL }}
